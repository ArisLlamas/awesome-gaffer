<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">Your first lighting scene</title>
  <desc id="desc">Set up the renderer, inspect a small scene, add a light, check the render, then explore shot variations.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#47637f"/></marker></defs>
  <rect width="900" height="200" rx="18" fill="#edf3f9"/>
  <text x="24" y="34" fill="#142638" font-family="sans-serif" font-weight="700" font-size="21">Your first lighting scene</text>
  <g fill="none" stroke="#47637f" stroke-width="2" marker-end="url(#arrow)"><path d="M172 113H194"/><path d="M348 113H370"/><path d="M524 113H546"/><path d="M700 113H722"/></g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#142638">
    <rect x="22" y="70" width="150" height="86" rx="9" fill="#fff" stroke="#7894ad"/><text x="97" y="106.5">Set up</text><text x="97" y="129.5">the renderer</text>
    <rect x="198" y="70" width="150" height="86" rx="9" fill="#fff" stroke="#7894ad"/><text x="273" y="106.5">Inspect</text><text x="273" y="129.5">a small scene</text>
    <rect x="374" y="70" width="150" height="86" rx="9" fill="#fff" stroke="#7894ad"/><text x="449" y="106.5">Add</text><text x="449" y="129.5">one key light</text>
    <rect x="550" y="70" width="150" height="86" rx="9" fill="#fff" stroke="#7894ad"/><text x="625" y="106.5">Check</text><text x="625" y="129.5">the render</text>
    <rect x="726" y="70" width="150" height="86" rx="9" fill="#fff" stroke="#7894ad"/><text x="801" y="106.5">Explore</text><text x="801" y="129.5">shot variations</text>
  </g>
</svg>
