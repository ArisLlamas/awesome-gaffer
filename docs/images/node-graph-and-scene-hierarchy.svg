<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">Node graph and scene hierarchy</title>
  <desc id="desc">Sphere and Camera feed Group. Its output contains /group, /group/sphere and /group/camera.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#47637f"/></marker></defs>
  <rect width="900" height="200" rx="18" fill="#edf3f9"/>
  <text x="24" y="34" fill="#142638" font-family="sans-serif" font-weight="700" font-size="21">Node graph and scene hierarchy</text>
  <g fill="none" stroke="#47637f" stroke-width="2" marker-end="url(#arrow)"><path d="M170 80L224 109"/><path d="M170 146L224 117"/><path d="M366 113H445"/><path d="M572 108L623 79"/><path d="M572 118L623 148"/></g>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#142638">
    <rect x="30" y="58" width="140" height="44" rx="9" fill="#fff" stroke="#7894ad"/><text x="100" y="85">Sphere</text>
    <rect x="30" y="124" width="140" height="44" rx="9" fill="#fff" stroke="#7894ad"/><text x="100" y="151">Camera</text>
    <rect x="226" y="91" width="140" height="44" rx="9" fill="#fff" stroke="#7894ad"/><text x="296" y="118">Group</text>
    <rect x="448" y="90" width="124" height="46" rx="9" fill="#fff" stroke="#7894ad"/><text x="510" y="118">/group</text>
    <rect x="626" y="56" width="238" height="44" rx="9" fill="#fff" stroke="#7894ad"/><text x="745" y="83">/group/sphere</text>
    <rect x="626" y="126" width="238" height="44" rx="9" fill="#fff" stroke="#7894ad"/><text x="745" y="153">/group/camera</text>
  </g>
</svg>
