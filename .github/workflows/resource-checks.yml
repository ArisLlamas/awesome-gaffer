name: Resource checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/build-readme.mjs --check
      - run: node scripts/check-links.mjs --local
      - run: node scripts/ste-lint.mjs
